[tools]
rust = { version = "1.99.1", components = "rustfmt,clippy" }
node = "24.22.0"
pnpm = "12.15.0"
# Needed by the cef crate to build CEF's C++ wrapper.
cmake = "4.4.4"
ninja = "1.13.2"
cargo-deny = "0.20.2"

[env]
# One exported CEF distribution, shared by every build instead of a download per build.
CEF_PATH = "{{env.HOME}}/cef"

[tasks.cef]
description = "Download CEF to CEF_PATH"
run = [
  "cargo install --locked export-cef-dir --version =156.0.0",
  "export-cef-dir --force \"$CEF_PATH\"",
]

[tasks.setup]
description = "Download CEF and install the CEF bundling tool"
depends = ["cef"]
run = "cargo install --locked cef --version =156.0.0 --features build-util --bin bundle-cef-app"

[tasks.ui]
description = "Build the UI"
dir = "ui"
run = ["pnpm install --frozen-lockfile", "pnpm build"]

[tasks.check]
description = "Run every check listed in CONTRIBUTING.md"
depends = ["ui"]
run = [
  "pnpm --dir ui lint",
  "pnpm --dir ui test",
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
  "cargo deny check",
]

[tasks.app]
description = "Build the UI and bundle the app"
depends = ["ui"]
run = [
  # Bundling in place over a previous build invalidates its code signature on macOS.
  "rm -rf target/bundle",
  "bundle-cef-app arbalette -o target/bundle -i net.leherpeur.arbalette -d Arbalette",
  "codesign --force --deep -s - target/bundle/arbalette.app",
]

[tasks.run]
description = "Build and run the app"
depends = ["app"]
run = "target/bundle/arbalette.app/Contents/MacOS/arbalette"
