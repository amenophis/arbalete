[tools]
rust = { version = "1.99.1", components = "rustfmt,clippy" }
# Needed by the cef crate to build CEF's C++ wrapper.
cmake = "4.4.4"
ninja = "1.13.2"
cargo-deny = "0.20.2"
# Lists the licenses of the crates the app is built from (mise run app).
"github:EmbarkStudios/cargo-about" = "0.9.3"
# Lays out the disk image's window (mise run release).
uv = "0.13.6"
"pipx:dmgbuild" = "1.6.7"

[env]
# One exported CEF distribution, shared by every build instead of a download per build.
CEF_PATH = "{{env.HOME}}/cef"
# Sparkle, the app's updater (app/macos/Updates.swift), in a folder named by its version.
SPARKLE_PATH = "{{env.HOME}}/sparkle/2.10.1"

# CEF's version, the cef crate's in the workspace's Cargo.toml, picks the CEF to download and the
# bundling tool to install. The official CEF leaves out Chromium's proprietary codecs (H.264, AAC),
# which sites like Twitch need: amenophis/cef-codecs builds the same CEF with them.
[tasks.cef]
description = "Download CEF, with Chromium's proprietary codecs, to CEF_PATH"
run = """
version=$(sed -n 's/^cef = "=\\(.*\\)"/\\1/p' Cargo.toml)
cargo install --locked export-cef-dir --version "=$version"
# The crate 156.0.0+156.0.7 takes CEF 156.0.7, named in full in CEF's index.
cef=$(sed -n '/^name = "cef"$/{n;s/^version = ".*+\\(.*\\)"/\\1/p;}' Cargo.lock)
name=$(curl -fsSL https://cef-builds.spotifycdn.com/index.json | grep -o "cef_binary_$cef+[^\\"]*_macosarm64_minimal.tar.bz2" | head -1)
[ -n "$name" ] || { echo "CEF $cef is not in CEF's index" >&2; exit 1; }
url="https://github.com/amenophis/cef-codecs/releases/download/cef-$cef-codecs/$(echo "$name" | sed 's/+/%2B/g')"
download=$(mktemp -d)
curl -fsSL -o "$download/$name" "$url" && curl -fsSL -o "$download/$name.sha256" "$url.sha256" ||
  { echo "amenophis/cef-codecs has no build of CEF $cef: build it there first (its README)." >&2; exit 1; }
(cd "$download" && shasum -a 256 -c "$name.sha256")
export-cef-dir --force --archive "$download/$name" "$CEF_PATH"
rm -rf "$download"
"""

[tasks.cef-bundler]
description = "Install bundle-cef-app, the CEF bundling tool"
run = """
version=$(sed -n 's/^cef = "=\\(.*\\)"/\\1/p' Cargo.toml)
cargo install --locked cef --version "=$version" --features build-util --bin bundle-cef-app
"""

# Sparkle's release archive, checked against its checksum, once per version.
[tasks.sparkle]
description = "Download Sparkle to SPARKLE_PATH"
run = """
[ -d "$SPARKLE_PATH/Sparkle.framework" ] && exit 0
version=$(basename "$SPARKLE_PATH")
archive=$(mktemp)
curl -fsSL -o "$archive" "https://github.com/sparkle-project/Sparkle/releases/download/$version/Sparkle-$version.tar.xz"
echo "1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  $archive" | shasum -a 256 -c
mkdir -p "$SPARKLE_PATH"
tar -xf "$archive" -C "$SPARKLE_PATH"
rm "$archive"
"""

[tasks.setup]
description = "Download CEF and Sparkle, and install the CEF bundling tool"
depends = ["cef", "sparkle", "cef-bundler"]

[tasks.check]
description = "Run every check listed in CONTRIBUTING.md"
# The interface links Sparkle (app/build.rs).
depends = ["sparkle"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
  "cargo deny check",
]

[tasks.app]
description = "Bundle the app"
depends = ["sparkle"]
# A development bundle, "Arbalete Dev", stands apart from an installed Arbalete: its own
# identifier, so its own preferences, permissions and default browser registration (its data
# folder too, app/src/main.rs), and its own icon. mise run release names the release's.
run = [
  # Bundling in place over a previous build invalidates its code signature on macOS.
  "rm -rf target/bundle",
  # Versioned like the app's crate.
  "bundle-cef-app arbalete -o target/bundle -i \"${ARBALETE_BUNDLE_ID:-io.github.amenophis.arbalete.dev}\" -d Arbalete -v \"$(sed -n 's/^version = \"\\(.*\\)\"/\\1/p' app/Cargo.toml)\"",
  # The bundle and its name in the menu bar and the Finder take a capital, unlike the executable.
  "mv target/bundle/arbalete.app target/bundle/Arbalete.app",
  "plutil -replace CFBundleName -string \"${ARBALETE_BUNDLE_NAME:-Arbalete Dev}\" target/bundle/Arbalete.app/Contents/Info.plist",
  "plutil -replace CFBundleDisplayName -string \"${ARBALETE_BUNDLE_NAME:-Arbalete Dev}\" target/bundle/Arbalete.app/Contents/Info.plist",
  # Its icon too: the release's with a dashed amber edge (assets/icon-dev.svg).
  "cp \"${ARBALETE_ICON:-app/resources/mac/arbalete-dev.icns}\" target/bundle/Arbalete.app/Contents/Resources/arbalete.icns",
  # Like Arc's, what the system writes for the app (times, apps' names, its panels) speaks the
  # system's language, around Arbalete's own English.
  "plutil -replace CFBundleAllowMixedLocalizations -bool YES target/bundle/Arbalete.app/Contents/Info.plist",
  # The interface needs macOS 14 (app/build.rs).
  "plutil -replace LSMinimumSystemVersion -string 14.0 target/bundle/Arbalete.app/Contents/Info.plist",
  # What macOS says as it first asks whether websites may use these, for a site the user allowed.
  "plutil -replace NSCameraUsageDescription -string 'Websites you allow can use your camera.' target/bundle/Arbalete.app/Contents/Info.plist",
  "plutil -replace NSMicrophoneUsageDescription -string 'Websites you allow can use your microphone.' target/bundle/Arbalete.app/Contents/Info.plist",
  "plutil -replace NSBluetoothAlwaysUsageDescription -string 'Websites you allow can connect to Bluetooth devices.' target/bundle/Arbalete.app/Contents/Info.plist",
  "plutil -replace NSLocationWhenInUseUsageDescription -string 'Websites you allow can know your location.' target/bundle/Arbalete.app/Contents/Info.plist",
  # Arbalete's license, and Chromium's and CEF's, which redistributing them requires.
  "cp LICENSE \"$CEF_PATH/CREDITS.html\" target/bundle/Arbalete.app/Contents/Resources/",
  # The Rust crates' licenses, which redistributing them requires too (about.toml, about.hbs).
  "cargo about generate --locked -o target/bundle/Arbalete.app/Contents/Resources/Rust-CREDITS.html about.hbs",
  # The updater (app/macos/Updates.swift), and its license, which redistributing it requires.
  "ditto \"$SPARKLE_PATH/Sparkle.framework\" target/bundle/Arbalete.app/Contents/Frameworks/Sparkle.framework",
  "cp \"$SPARKLE_PATH/LICENSE\" target/bundle/Arbalete.app/Contents/Resources/Sparkle-LICENSE",
  # A release looks for updates in its feed (mise run release), signed with the private half of
  # packaging/sparkle/public-key. Without a feed, a development build never updates itself.
  "[ -z \"${ARBALETE_FEED_URL:-}\" ] || grep -Eqx '[A-Za-z0-9+/]{43}=' packaging/sparkle/public-key || { echo 'packaging/sparkle/public-key holds no EdDSA public key: see the README, Releasing.' >&2; exit 1; }",
  "[ -z \"${ARBALETE_FEED_URL:-}\" ] || plutil -insert SUFeedURL -string \"$ARBALETE_FEED_URL\" target/bundle/Arbalete.app/Contents/Info.plist",
  "[ -z \"${ARBALETE_FEED_URL:-}\" ] || plutil -insert SUPublicEDKey -string \"$(cat packaging/sparkle/public-key)\" target/bundle/Arbalete.app/Contents/Info.plist",
  # It looks once a day (Sparkle's default) without asking first, and downloads an update silently:
  # a banner in the sidebar then offers to restart into it, like Arc's.
  "plutil -insert SUEnableAutomaticChecks -bool YES target/bundle/Arbalete.app/Contents/Info.plist",
  "plutil -insert SUAutomaticallyUpdate -bool YES target/bundle/Arbalete.app/Contents/Info.plist",
  # The helper extension, loaded in every profile (app/src/extensions.rs).
  "cp -R app/extension target/bundle/Arbalete.app/Contents/Resources/arbalete-helper",
  # A browser opens web links: macOS offers it as the default browser, which other apps' links
  # then open in (mac::watch_links).
  "plutil -insert CFBundleURLTypes -json '[{\"CFBundleURLName\":\"Web site URL\",\"CFBundleURLSchemes\":[\"http\",\"https\"]}]' target/bundle/Arbalete.app/Contents/Info.plist",
  # System Settings lists, as default browsers, only the apps that also view web pages.
  "plutil -insert CFBundleDocumentTypes -json '[{\"CFBundleTypeName\":\"HTML document\",\"CFBundleTypeRole\":\"Viewer\",\"LSItemContentTypes\":[\"public.html\",\"public.xhtml\"]}]' target/bundle/Arbalete.app/Contents/Info.plist",
  # The helpers take their own identifiers, like CEF's: sharing the app's, one of them could
  # receive the links macOS sends to the default browser.
  "for helper in target/bundle/Arbalete.app/Contents/Frameworks/*Helper*.app; do suffix=$(basename \"$helper\" .app | sed -n 's/.*(\\(.*\\))/.\\1/p' | tr A-Z a-z); plutil -replace CFBundleIdentifier -string \"${ARBALETE_BUNDLE_ID:-io.github.amenophis.arbalete.dev}.helper$suffix\" \"$helper/Contents/Info.plist\"; done",
  # Ad hoc signatures change on every build, so macOS asks again for each permission. A stable
  # identity, set in .config/mise.local.toml (not committed), keeps permissions across builds.
  # The framework and the helpers, which read and write the data, are signed one by one: --deep
  # keeps the helpers' ad hoc signature.
  "for code in target/bundle/Arbalete.app/Contents/Frameworks/*; do codesign --force -s \"${ARBALETE_SIGN_IDENTITY:--}\" \"$code\"; done",
  "codesign --force -s \"${ARBALETE_SIGN_IDENTITY:--}\" target/bundle/Arbalete.app",
  # The Dock and the app switcher show the bundle's name only when its file bears it: a
  # development bundle is "Arbalete Dev.app".
  "name=\"${ARBALETE_BUNDLE_NAME:-Arbalete Dev}\" && [ \"$name\" = Arbalete ] || mv target/bundle/Arbalete.app \"target/bundle/$name.app\"",
]

[tasks.release]
description = "Bundle an optimized app, signed with ARBALETE_SIGN_IDENTITY, in a disk image"
# bundle-cef-app builds the dev profile only: optimized here, in a folder of its own, so that
# the development build stays as it is.
env = { ARBALETE_BUNDLE_ID = "io.github.amenophis.arbalete", ARBALETE_BUNDLE_NAME = "Arbalete", ARBALETE_FEED_URL = "https://arbalete.co/appcast.xml", ARBALETE_ICON = "app/resources/mac/arbalete.icns", CARGO_TARGET_DIR = "target/release-build", CARGO_PROFILE_DEV_OPT_LEVEL = "3", CARGO_PROFILE_DEV_DEBUG = "0", CARGO_PROFILE_DEV_DEBUG_ASSERTIONS = "false", CARGO_PROFILE_DEV_OVERFLOW_CHECKS = "false", CARGO_PROFILE_DEV_INCREMENTAL = "false" }
run = [
  "mise run app",
  # The app beside a link to Applications, to drag it onto (packaging/dmg).
  "rm -rf target/dmg && mkdir -p target/dmg",
  "version=$(sed -n 's/^version = \"\\(.*\\)\"/\\1/p' app/Cargo.toml) && dmgbuild -s packaging/dmg/settings.py -D app=target/bundle/Arbalete.app Arbalete \"target/dmg/Arbalete-$version-arm64.dmg\" && cd target/dmg && shasum -a 256 \"Arbalete-$version-arm64.dmg\" | tee \"Arbalete-$version-arm64.dmg.sha256\"",
]

[tasks.website]
description = "Build the website into website/dist"
run = "node website/scripts/build.mjs"

[tasks.run]
description = "Build and run the app"
depends = ["app"]
run = "'target/bundle/Arbalete Dev.app/Contents/MacOS/arbalete'"
