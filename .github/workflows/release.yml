name: Release

# A version tag, pushed from main once app/Cargo.toml has its version: builds the disk image,
# publishes it as a GitHub release and updates the cask in amenophis/homebrew-tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # To start the website's deployment, which lists the new release.
  actions: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      # The whole history, for the notes since the previous tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tag is the app's version, on main
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not the app's version, $version."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag $GITHUB_REF_NAME is not on main."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      # The same CEF as CI's.
      - name: Cache CEF
        id: cef-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/cef
          key: cef-156.0.7-${{ runner.os }}-${{ runner.arch }}

      - name: Export CEF
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: mise run cef

      - name: Install the CEF bundling tool
        run: cargo install --locked cef --version =156.0.0 --features build-util --bin bundle-cef-app

      # A keychain of the job's own, deleted with the runner, holding the release certificate.
      - name: Import the release certificate
        env:
          SIGN_P12: ${{ secrets.SIGN_P12 }}
          SIGN_P12_PASSWORD: ${{ secrets.SIGN_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$SIGN_P12" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -P "$SIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/release.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain

      - name: Build the disk image
        env:
          ARBALETE_SIGN_IDENTITY: Arbalete Release
        run: mise run release

      # The disk image's EdDSA signature and length, which the app checks before installing an
      # update: the website puts them in its appcast (website/scripts/build.mjs).
      - name: Sign the update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::The SPARKLE_PRIVATE_KEY secret is missing: the app could not install this update."
            exit 1
          fi
          eval "$(mise env -s bash)"
          dmg="target/dmg/Arbalete-$VERSION-arm64.dmg"
          echo "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_PATH/bin/sign_update" --ed-key-file - "$dmg" > "$dmg.sig"
          cat "$dmg.sig"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packaging/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "Arbalete $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "target/dmg/Arbalete-$VERSION-arm64.dmg" "target/dmg/Arbalete-$VERSION-arm64.dmg.sha256" \
            "target/dmg/Arbalete-$VERSION-arm64.dmg.sig"

      - name: Update the cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          sha=$(cut -d' ' -f1 "target/dmg/Arbalete-$VERSION-arm64.dmg.sha256")
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/amenophis/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$sha/" packaging/homebrew/arbalete.rb \
            | sed '1,2d' > "$RUNNER_TEMP/tap/Casks/arbalete.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "Jérémy LEHERPEUR"
          git config user.email "amenophis@leherpeur.net"
          git add Casks/arbalete.rb
          git commit -m "arbalete $VERSION"
          git push origin HEAD:main

      # A release published with the workflow's token starts no other workflow: the website's
      # "release: published" never fires, so its deployment is started here.
      - name: Deploy the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --ref main
