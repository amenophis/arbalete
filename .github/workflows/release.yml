name: Release

# A version tag, pushed from main once app/Cargo.toml has its version: builds the disk image,
# publishes it as a GitHub release and updates the cask in amenophis/homebrew-tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      # The whole history, for the notes since the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is the app's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not the app's version, $version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: jdx/mise-action@v5

      # The same CEF as CI's.
      - name: Cache CEF
        id: cef-cache
        uses: actions/cache@v6
        with:
          path: ~/cef
          key: cef-156.0.7-${{ runner.os }}-${{ runner.arch }}

      - name: Export CEF
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: mise run cef

      - name: Install the CEF bundling tool
        run: cargo install --locked cef --version =156.0.0 --features build-util --bin bundle-cef-app

      # A keychain of the job's own, deleted with the runner, holding the release certificate.
      - name: Import the release certificate
        env:
          SIGN_P12: ${{ secrets.SIGN_P12 }}
          SIGN_P12_PASSWORD: ${{ secrets.SIGN_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$SIGN_P12" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -P "$SIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/release.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain

      - name: Build the disk image
        env:
          ARBALETE_SIGN_IDENTITY: Arbalete Release
        run: mise run release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packaging/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "Arbalete $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "target/dmg/Arbalete-$VERSION-arm64.dmg" "target/dmg/Arbalete-$VERSION-arm64.dmg.sha256"

      - name: Update the cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          sha=$(cut -d' ' -f1 "target/dmg/Arbalete-$VERSION-arm64.dmg.sha256")
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/amenophis/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$sha/" packaging/homebrew/arbalete.rb \
            | sed '1,2d' > "$RUNNER_TEMP/tap/Casks/arbalete.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "Jérémy LEHERPEUR"
          git config user.email "amenophis@leherpeur.net"
          git add Casks/arbalete.rb
          git commit -m "arbalete $VERSION"
          git push origin HEAD:main
