name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # An exported CEF distribution, shared by the build and, on Linux and Windows, loaded by the tests.
      CEF_PATH: ${{ github.workspace }}/../cef
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2

      - name: Cache CEF
        id: cef-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-156.0.7-${{ runner.os }}-${{ runner.arch }}

      - name: Export CEF
        if: steps.cef-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install --locked export-cef-dir --version =156.0.0
          export-cef-dir --force "$CEF_PATH"

      - name: Load CEF from its directory (Linux)
        if: runner.os == 'Linux'
        run: echo "LD_LIBRARY_PATH=$CEF_PATH" >> "$GITHUB_ENV"

      - name: Load CEF from its directory (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$CEF_PATH" >> "$GITHUB_PATH"

      - run: mise run check
