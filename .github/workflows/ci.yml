name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # macOS only for now: Linux and Windows are added when the app targets them (plan, phase 10).
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          # The default key hashes every Rust version installed on the runner, which varies between
          # runner images; the version that matters is pinned in mise.toml.
          add-rust-environment-hash-key: false
          key: ${{ hashFiles('.config/mise.toml') }}

      # An exported CEF distribution, shared by every build instead of a download per build.
      # actions/cache needs a path without "..": keep it in the home directory.
      - name: Locate CEF
        run: echo "CEF_PATH=$HOME/cef" >> "$GITHUB_ENV"

      - name: Cache CEF
        id: cef-cache
        uses: actions/cache@v6
        with:
          path: ~/cef
          key: cef-156.0.7-${{ runner.os }}-${{ runner.arch }}

      - name: Export CEF
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked export-cef-dir --version =156.0.0
          export-cef-dir --force "$CEF_PATH"

      - run: mise run check
