name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Whether the change touches what `mise run check` builds and tests: a change to the website
  # (it deploys on its own), the docs, the Markdown files or the packaging (built only by a
  # release) neither builds nor tests the app.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.files.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch or an unknown base: check everything.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          others=$(git diff --name-only "$BASE" HEAD | grep -v -E \
            -e '^(website|docs|packaging)/' -e '^[^/]+\.md$' \
            -e '^\.github/workflows/(website|release)\.yml$' || true)
          echo "app=$([ -n "$others" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # macOS only for now: Linux and Windows are added when the app targets them (plan, phase 10).
  # Skipped for those changes alone, which a required check counts as passed.
  check:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          # The default key hashes every Rust version installed on the runner, which varies between
          # runner images. Without it, a pull request that changes Cargo.lock or mise.toml still
          # restores main's latest cache; cargo rebuilds only what changed.
          add-rust-environment-hash-key: false
          # Pull requests read main's cache (GitHub falls back to the base branch) without saving
          # their own: the repository's 10 GB of cache stays for main.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # CEF_PATH, set in mise.toml. actions/cache needs a path without "..".
      - name: Cache CEF
        id: cef-cache
        uses: actions/cache@v6
        with:
          path: ~/cef
          key: cef-156.0.7-${{ runner.os }}-${{ runner.arch }}

      - name: Export CEF
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: mise run cef

      - run: mise run check
