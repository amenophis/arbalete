name: Website

# The website (website/) deploys on its own, apart from the app's releases: on a change to it on
# main, by hand, and when the release workflow publishes a release, which its notes list.
on:
  push:
    branches: [main]
    paths: ["website/**", "assets/favicon.svg", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, the latest winning.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # PostHog's project key (EU), public: it can only send events.
          POSTHOG_KEY: phc_AT8fJDvQpTrnChDu3P8NLtsyz7vQa5rq4gKyFTPGxZCg
        run: node website/scripts/build.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
