name: Website

# The website (website/) deploys on its own, apart from the app's releases: on a change to it on
# main, by hand, and when a release is published, which its release notes list.
on:
  push:
    branches: [main]
    paths: ["website/**", "assets/favicon.svg", ".github/workflows/website.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, the latest winning.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node website/scripts/build.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
      - id: deployment
        uses: actions/deploy-pages@v5
