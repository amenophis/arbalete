version: 2
updates:
  # Keeps the actions' pinned commit hashes, and their version comments, current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Moves with the CEF the workflows export and cache: updated by hand, together.
      - dependency-name: cef
