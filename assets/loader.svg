<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Loading">
  <!-- Loader: the vanes bend (C1 into C4), the bolt turns once, they straighten. 1.6 s loop. -->
  <defs><mask id="hole" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="50" r="5.5" fill="#000"/></mask></defs>
  <g mask="url(#hole)"><g fill="none" stroke-width="16" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.65 0 0.35 1"/>
    <path d="M50 50 C50 40 50 29 50 19" stroke="#FF5A5A"><animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.3;0.7;1" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" values="M50 50 C50 40 50 29 50 19;M50 50 C58 40 59 27 49 17;M50 50 C58 40 59 27 49 17;M50 50 C50 40 50 29 50 19"/></path>
    <path d="M50 50 C50 40 50 29 50 19" stroke="#A35BFF" transform="rotate(120 50 50)"><animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.3;0.7;1" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" values="M50 50 C50 40 50 29 50 19;M50 50 C58 40 59 27 49 17;M50 50 C58 40 59 27 49 17;M50 50 C50 40 50 29 50 19"/></path>
    <path d="M50 50 C50 40 50 29 50 19" stroke="#3D7BFF" transform="rotate(240 50 50)"><animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.3;0.7;1" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" values="M50 50 C50 40 50 29 50 19;M50 50 C58 40 59 27 49 17;M50 50 C58 40 59 27 49 17;M50 50 C50 40 50 29 50 19"/></path>
  </g></g>
</svg>
