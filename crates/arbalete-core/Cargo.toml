[package]
name = "arbalete-core"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
aes = "0.9.4"
cbc = "0.2.1"
md5 = "0.8.1"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
plist = "1.10.3"
rusqlite = { version = "0.41.0", features = ["bundled"] }
rusty-leveldb = "4.0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
