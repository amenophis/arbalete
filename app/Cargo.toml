[package]
name = "arbalette"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
autobins = false

[[bin]]
name = "arbalette"
path = "src/main.rs"

[[bin]]
name = "arbalette_helper"
path = "src/bin/helper.rs"

[package.metadata.cef.bundle]
helper_name = "arbalette_helper"
# Copied into the macOS bundle; arbalette.icns becomes the app icon.
resources_path = "resources"

[dependencies]
arbalette-core = { path = "../crates/arbalette-core" }
cef = "=156.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
# On Windows the sandbox needs a separate bootstrap executable: not set up yet.
cef = { version = "=156.0.0", features = ["sandbox"] }
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }
