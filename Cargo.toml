[workspace]
resolver = "3"
members = ["app", "crates/arbalete-core"]

# The one place CEF's version is set: the mise tasks (.config/mise.toml) and the workflows' CEF
# cache read it from here, so the bindings, the CEF they download and the bundling tool move together.
[workspace.dependencies]
cef = "=156.0.0"

# Which of amenophis/cef-codecs' builds of that CEF to take: its release, cef-<CEF>-codecs.<revision>.
# Renovate proposes each new one, and .github/workflows/cef-crate.yml moves the crate above along.
[workspace.metadata]
cef-codecs = "cef-156.0.7-codecs.6"

# Build scripts and their dependencies keep their debug info, as when cargo build shares them with
# the app: cargo check (clippy) then builds them as cargo build and cargo test do, and CEF's
# wrapper (cef-dll-sys) is built once rather than once more for the tests.
[profile.dev.build-override]
debug = true
